services:
  - type: web
    name: symposium-unified
    plan: free
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: # Set this in Render Dashboard after getting it from Aiven
      - key: DB_USER
        value: # Set this in Render Dashboard after getting it from Aiven
      - key: DB_PASSWORD
        value: # Set this in Render Dashboard after getting it from Aiven
      - key: DB_NAME
        value: # Set this in Render Dashboard after getting it from Aiven
      - key: DB_PORT
        value: # Set this in Render Dashboard after getting it from Aiven
